spring:
  application:
    name: ecom-api-gateway
  cloud:
    gateway:
     server:
       webflux:
        routes:
          - id : ecom-order-service
            # uri: http://localhost:8080// static routing
            uri: lb://ecom-order-service
            predicates:
              - Path=/order/**
          - id : ecom-inventory-service
            uri: lb://ecom-inventory-service
            predicates:
              - Path=/inventory/**
server:
   port: 9098
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
# this above eureka url we need to add for register our api into eureka server 
# spring.